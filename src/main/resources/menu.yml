# ==============================================================
#                 SETTING & ADMIN GUI MENUS
# ==============================================================
# Configures layout, items, slots, and styling for /setting and /setting admin.
# Follows the Catppuccin color palette and Nexo glyph integrations.
# ==============================================================

setting-menu:
  title: "<#6c7086>✦ <#89dceb><b>ᴘᴇʀsᴏɴᴀʟ sᴇᴛᴛɪɴɢs</b> <#6c7086>✦"
