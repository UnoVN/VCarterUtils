name: VCarterUtils
version: '1.0.0'
main: me.nh4n.vcarterutils.VCarterUtils
api-version: '1.21'
author: Nh4n
description: Plugin tinh diem 1v1 action bar 15s va autopot PerPlayerKit giu nguyen lo thuoc.
softdepend:
  - PlaceholderAPI
  - PerPlayerKit
commands:
  score:
    description: Manage 1v1 scores and reset requests
    aliases: [vscore, sc]
permissions:
  vcarterutils.admin:
    description: Allows administrative score reset commands
    default: op
