      type: "TRAINING_MODE_TOGGLE"
      slot: 13
      material: "TARGET"
      name: "<!italic><white><sprite:items:item/totem_of_undying></white> <#89dceb><b>Training Mode</b>"
      lore:
        - "<!italic><#6c7086>ᴘʀᴀᴄᴛɪᴄᴇ & sᴀɴᴅʙᴏx"
        - ""
        - "<!italic><#6c7086>▪ <#a6adc8>sᴛᴀᴛᴜs: %training_status%"
