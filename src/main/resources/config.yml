# ==============================================================
#                 VCarterUtils Configuration
#     Catppuccin Pastel • Glyph • 1.21+ Object Sprite Icons
# ==============================================================

autopot:
  enabled: true
  blacklisted-worlds:
    - "ffa_diamond"

totem:
  enabled: true
  max-in-inventory: 1
  max-activations-per-kit: 1
  excess-action: "REMOVE"
  blacklisted-worlds:
    - "ffa_diamond"
  messages:
    inventory-limit-reached: "<glyph:warning_blue> <white><sprite:items:item/totem_of_undying></white> <#f38ba8>Max <#89dceb><b>%max%</b> <#f38ba8>Totem allowed in inventory!"
    activation-limit-reached: "<glyph:warning_blue> <white><sprite:items:item/totem_of_undying></white> <#f38ba8>Totem limit reached for this kit!"

# ==============================================================
#                 ENDER PEARL COOLDOWN SYSTEM
# ==============================================================
pearl-cooldown:
  enabled: true
  default-seconds: 1
  available-options:
    - 0
    - 1
    - 3
    - 5
    - 6
    - 8
    - 10
    - 15
  clear-on-respawn: true
  clear-on-kit-load: true
  send-chat-on-change: true

  global-force:
    enabled: false
    seconds: 1

  force-worlds:
    enabled: true
    worlds:
      ffa_diamond: 10

  messages:
    cooldown-changed: "<glyph:warning_blue> <white><sprite:items:item/ender_pearl></white> <#a6adc8>Pearl cooldown: <#89dceb><b>%seconds%s</b>"
    invalid-option: "<glyph:warning_blue> <white><sprite:items:item/ender_pearl></white> <#f38ba8>Invalid option! Available: <#89dceb>%options%"
    world-status-normal: "<#a6e3a1>● Personal setting active"
    world-status-forced: "<#f9e2af>● World forced: <#89dceb><b>%forced%s</b>"
    world-status-global-forced: "<#f9e2af>● Global forced: <#89dceb><b>%forced%s</b>"

# ==============================================================
#                     MACE COOLDOWN SYSTEM
# ==============================================================
mace-cooldown:
  enabled: true
  default-seconds: 5
  available-options:
    - 0
    - 1
    - 3
    - 5
    - 6
    - 8
    - 10
    - 15
  only-players: false
  only-smash-attack: false
  cancel-attack-on-cooldown: true
  clear-on-respawn: true
  clear-on-kit-load: true
  send-chat-on-change: true

  global-force:
    enabled: false
    seconds: 5

  force-worlds:
    enabled: true
    worlds:
      ffa_diamond: 10

  messages:
    cooldown-changed: "<glyph:warning_blue> <white><sprite:items:item/mace></white> <#a6adc8>Mace cooldown: <#89dceb><b>%seconds%s</b>"
    invalid-option: "<glyph:warning_blue> <white><sprite:items:item/mace></white> <#f38ba8>Invalid option! Available: <#89dceb>%options%"
    on-cooldown: "<glyph:warning_blue> <white><sprite:items:item/mace></white> <#f38ba8>Mace cooldown: <#f9e2af><b>%seconds%s</b>"
    world-status-normal: "<#a6e3a1>● Personal setting active"
    world-status-forced: "<#f9e2af>● World forced: <#89dceb><b>%forced%s</b>"
    world-status-global-forced: "<#f9e2af>● Global forced: <#89dceb><b>%forced%s</b>"

# ==============================================================
#                 CUSTOMIZABLE /SETTING MENU
# ==============================================================
setting-menu:
  title: "<#6c7086>✦ <#89dceb><b>Settings</b> <#6c7086>✦"
  rows: 3
  filler:
    enabled: true
    material: "GRAY_STAINED_GLASS_PANE"
    name: " "
  # Types: PEARL_COOLDOWN, MACE_COOLDOWN, ADMIN_MENU, CLOSE, COMMAND, DECORATION
  items:
    pearl-cooldown:
      enabled: true
      type: "PEARL_COOLDOWN"
      slot: 11
      material: "ENDER_PEARL"
      show-seconds-as-amount: true
      name: "<!italic><white><sprite:items:item/ender_pearl></white> <#89dceb><b>Pearl Cooldown</b>"
      lore:
        - ""
        - "<!italic><#a6adc8>Personal: <#89dceb><b>%current%s</b> <#6c7086>(Default: %default%s)"
        - "<!italic><#a6adc8>Effective: <#f9e2af><b>%effective%s</b>"
        - "<!italic>%world_status%"
        - ""
        - "<!italic><#a6adc8>Presets: %options_list%"
        - ""
        - "<!italic><white><glyph:left_click></white> <#a6e3a1>Increase <#6c7086>| <white><glyph:right_click></white> <#f9e2af>Decrease"
        - "<!italic><#f38ba8>Shift + <white><glyph:left_click></white> <#a6adc8>Reset default"
    mace-cooldown:
      enabled: true
      type: "MACE_COOLDOWN"
      slot: 15
      material: "MACE"
      show-seconds-as-amount: true
      name: "<!italic><white><sprite:items:item/mace></white> <#89dceb><b>Mace Cooldown</b>"
      lore:
        - ""
        - "<!italic><#a6adc8>Personal: <#89dceb><b>%current%s</b> <#6c7086>(Default: %default%s)"
        - "<!italic><#a6adc8>Effective: <#f9e2af><b>%effective%s</b>"
        - "<!italic>%world_status%"
        - ""
        - "<!italic><#a6adc8>Presets: %options_list%"
        - ""
        - "<!italic><white><glyph:left_click></white> <#a6e3a1>Increase <#6c7086>| <white><glyph:right_click></white> <#f9e2af>Decrease"
        - "<!italic><#f38ba8>Shift + <white><glyph:left_click></white> <#a6adc8>Reset default"
    admin-panel:
      enabled: true
      type: "ADMIN_MENU"
      slot: 4
      material: "COMPARATOR"
      name: "<!italic><white><sprite:items:item/comparator></white> <#f38ba8><b>Admin Manager</b>"
      lore:
        - ""
        - "<!italic><#a6adc8>Configure Global & Per-World"
        - "<!italic><#a6adc8>cooldown overrides."
        - ""
        - "<!italic><white><glyph:left_click></white> <#89dceb>Open Admin GUI"
    close-button:
      enabled: true
      type: "CLOSE"
      slot: 22
      material: "BARRIER"
      name: "<!italic><white><sprite:items:item/barrier></white> <#f38ba8><b>Close</b>"
      lore:
        - "<!italic><white><glyph:left_click></white> <#6c7086>Close menu"

# ==============================================================
#                      BACK ON DEATH FEATURE
# ==============================================================
back:
  enabled: true
  blacklisted-worlds:
    - "ffa_diamond"
  messages:
    death-notify: "<glyph:warning_blue> <white><sprite:items:item/recovery_compass></white> <#a6adc8>You died! Click <click:run_command:'/back'><hover:show_text:'<#a6e3a1>Click to return'><#89dceb><b>[RETURN]</b></hover></click> <#a6adc8>or <#89dceb>/back"
    teleported: "<glyph:warning_blue> <white><sprite:items:item/recovery_compass></white> <#a6e3a1>Returned to death location!"
    no-death-location: "<glyph:warning_blue> <white><sprite:items:item/recovery_compass></white> <#f38ba8>No previous death location!"
    world-blacklisted: "<glyph:warning_blue> <white><sprite:items:item/recovery_compass></white> <#f38ba8>/back is disabled in this world!"

# ==============================================================
#                      SHULKER REGEAR SYSTEM
# ==============================================================
regear:
  damage-cooldown-seconds: 5
  cooldown-seconds: 3
  clear-junk-in-empty-slots: true
  announcement:
    enabled: true
    broadcast: true
    message: "<glyph:warning_blue> <white><sprite:blocks:block/cyan_shulker_box></white> <#89dceb><b>%player%</b> <#a6adc8>regeared"

  whitelist:
    - ENDER_PEARL
    - TNT_MINECART
    - SPLASH_POTION
    - CROSSBOW
    - ELYTRA
    - COBWEB
    - ARROWS
    - AXES
    - PICKAXES
    - PLANKS
    - WOOD
    - RAILS

  item:
    name: "<!italic><white><sprite:blocks:block/cyan_shulker_box></white> <#89dceb><b>Shulker Regear</b>"
    lore:
      - "<!italic><white><glyph:right_click></white> <#a6adc8>Place to restock inventory"
      - "<!italic><#6c7086>Auto-removes after placement"

  messages:
    already-have-shulker: "<glyph:warning_blue> <white><sprite:blocks:block/cyan_shulker_box></white> <#f38ba8>You already have a <#89dceb>Regear Shulker<#f38ba8>!"
    inventory-full: "<glyph:warning_blue> <white><sprite:blocks:block/cyan_shulker_box></white> <#f38ba8>Inventory full! <#a6adc8>Free 1 slot first."
    received-shulker: "<glyph:warning_blue> <white><sprite:blocks:block/cyan_shulker_box></white> <#a6e3a1>Received <#89dceb><b>Shulker Regear</b> <#6c7086>(<white><glyph:right_click></white> Place)"
    combat-tagged: "<glyph:warning_blue> <white><sprite:blocks:block/cyan_shulker_box></white> <#f38ba8>In combat! Wait <#f9e2af><b>%seconds%s</b>"
    on-cooldown: "<glyph:warning_blue> <white><sprite:blocks:block/cyan_shulker_box></white> <#f38ba8>Regear cooldown: <#f9e2af><b>%seconds%s</b>"
    no-kit-loaded: "<glyph:warning_blue> <white><sprite:blocks:block/cyan_shulker_box></white> <#f38ba8>Load a kit first <#89dceb>(/k1)"
    success: "<glyph:warning_blue> <white><sprite:blocks:block/cyan_shulker_box></white> <#a6e3a1>Inventory restocked!"

# ==============================================================
#                        1V1 SCORE SYSTEM
# ==============================================================
score:
  auto-reset:
    enabled: true
    interval-minutes: 60
    broadcast: true
  request-timeout-seconds: 60
  messages:
    no-permission: "<glyph:warning_blue> <#f38ba8>No permission."
    player-not-found: "<glyph:warning_blue> <white><sprite:items:item/diamond_sword></white> <#f38ba8>Player <#89dceb>%target% <#f38ba8>is offline."
    cannot-target-self: "<glyph:warning_blue> <white><sprite:items:item/diamond_sword></white> <#f38ba8>Cannot target yourself."
    request-sent: "<glyph:warning_blue> <white><sprite:items:item/diamond_sword></white> <#a6e3a1>Reset request sent to <#89dceb><b>%target%</b>"
    request-received: "<glyph:warning_blue> <white><sprite:items:item/diamond_sword></white> <#89dceb><b>%sender%</b> <#a6adc8>wants to reset 1v1 score: <click:run_command:'/score accept %sender%'><hover:show_text:'<#a6e3a1>Click to accept'><#a6e3a1><b>[ACCEPT]</b></hover></click> <click:run_command:'/score decline %sender%'><hover:show_text:'<#f38ba8>Click to decline'><#f38ba8><b>[DECLINE]</b></hover></click>"
    no-pending-request: "<glyph:warning_blue> <white><sprite:items:item/diamond_sword></white> <#f38ba8>No pending request from <#89dceb>%sender%"
    request-declined: "<glyph:warning_blue> <white><sprite:items:item/diamond_sword></white> <#f38ba8>Reset request with <#89dceb>%player% <#f38ba8>declined."
    score-reset-success: "<glyph:warning_blue> <white><sprite:items:item/diamond_sword></white> <#a6e3a1>Score reset: <#89dceb><b>%player1%</b> <#6c7086>vs <#89dceb><b>%player2%</b>"
    global-reset-admin: "<glyph:warning_blue> <white><sprite:items:item/diamond_sword></white> <#a6e3a1>All 1v1 scores reset by Admin."
    global-reset-auto: "<glyph:warning_blue> <white><sprite:items:item/diamond_sword></white> <#a6e3a1>All 1v1 scores auto-reset."
    usage: "<glyph:warning_blue> <white><sprite:items:item/diamond_sword></white> <#89dceb>/score reset <player> <#6c7086>| <#89dceb>accept <player> <#6c7086>| <#89dceb>resetall"

admin:
  messages:
    reload-success: "<glyph:warning_blue> <white><sprite:items:item/comparator></white> <#a6e3a1>VCarterUtils reloaded!"
