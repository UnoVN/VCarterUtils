        - "<!italic><#6c7086>▪ <#a6adc8>ᴘʀᴇsᴇᴛs: %options_list%"
        - ""
        - "<!italic><white><glyph:left_click></white> <#a6e3a1>ɪɴᴄʀᴇᴀsᴇ <#6c7086>│ <white><glyph:right_click></white> <#f9e2af>ᴅᴇᴄʀᴇᴀsᴇ"
        - "<!italic><#f38ba8>sʜɪꜰᴛ + <white><glyph:left_click></white> <#a6adc8>ʀᴇsᴇᴛ ᴅᴇꜰᴀᴜʟᴛ"
