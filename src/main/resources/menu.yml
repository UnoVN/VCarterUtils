        - ""
        - "<!italic><#6c7086>▪ <#a6adc8>ᴘᴇʀsᴏɴᴀʟ: <#89dceb><b>%current%s</b> <#6c7086>(ᴅᴇꜰᴀᴜʟᴛ: %default%s)"
        - "<!italic><#6c7086>▪ <#a6adc8>ᴇꜰꜰᴇᴄᴛɪᴠᴇ: <#f9e2af><b>%effective%s</b>"
        - "<!italic>%world_status%"
