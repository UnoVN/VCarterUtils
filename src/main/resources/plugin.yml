name: VCarterUtils
version: '1.0.0'
main: me.nh4n.vcarterutils.VCarterUtils
api-version: '1.21'
author: Nh4n
description: Plugin tinh diem 1v1 action bar 15s, Regear tuy bien, Pearl Cooldown va tinh nang Back khi tu tran.
softdepend:
  - PlaceholderAPI
  - PerPlayerKit
commands:
  score:
    description: Manage 1v1 scores and reset requests
    aliases: [vscore, sc]
  vcarterutils:
    description: Main plugin command
    aliases: [vcu, vcarter]
  back:
    description: Return to your previous death location
    aliases: [deathback, return]
  setting:
    description: Open personal PvP settings menu
    aliases: [settings, options, vsetting]
permissions:
  vcarterutils.admin:
    description: Allows administrative score reset and config reload commands
    default: op
