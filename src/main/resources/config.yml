# ==============================================================
#                 VCarterUtils Configuration
#       Catppuccin Pastel Palette & Glyph Integration
# ==============================================================

autopot:
  enabled: true
  blacklisted-worlds:
    - "ffa_diamond"

totem:
  enabled: true
  max-in-inventory: 1
  max-activations-per-kit: 1
  excess-action: "REMOVE"
  blacklisted-worlds:
    - "ffa_diamond"
  messages:
    inventory-limit-reached: "<glyph:warning_blue> <#f38ba8>You can only carry <#89dceb>%max%<#f38ba8> Totem of Undying in your inventory!"
    activation-limit-reached: "<glyph:warning_blue> <#f38ba8>You have already used your Totem for this kit! Totem activation denied."

# ==============================================================
#                      BACK ON DEATH FEATURE
# ==============================================================
back:
  enabled: true
  # Danh sach world KHONG THE su dung /back (khong the back tu world nay hoac back ve world nay)
  blacklisted-worlds:
    - "ffa_diamond"
  messages:
    death-notify: "<glyph:warning_blue> <#a6adc8>You died! Click <click:run_command:'/back'><hover:show_text:'<#a6e3a1>Click to teleport back'><#89dceb><b>[HERE]</b></hover></click> or type <#89dceb><b>/back</b><#a6adc8> to return."
    teleported: "<glyph:warning_blue> <#a6e3a1>Successfully teleported back to your previous death location!"
    no-death-location: "<glyph:warning_blue> <#f38ba8>You do not have a previous death location to return to!"
    world-blacklisted: "<glyph:warning_blue> <#f38ba8>The /back feature is disabled in or to this world!"

regear:
  damage-cooldown-seconds: 5
  cooldown-seconds: 3
  clear-junk-in-empty-slots: true
  announcement:
    enabled: true
    broadcast: true
    message: "<glyph:warning_blue> <#89dceb><b>%player%</b> <#a6adc8>regeared"

  whitelist:
    - ENDER_PEARL
    - TNT_MINECART
    - SPLASH_POTION
    - CROSSBOW
    - ELYTRA
    - COBWEB
    - ARROWS
    - AXES
    - PICKAXES
    - PLANKS
    - WOOD
    - RAILS

  item:
    name: "<#89dceb><b><!italic>Shulker Regear</b>"
    lore:
      - "<#a6adc8><!italic>Place on the ground to restock."
      - "<#6c7086><!italic>Automatically disappears after use."

  messages:
    already-have-shulker: "<glyph:warning_blue> <#f38ba8>You already have a <#89dceb>Regear Shulker<#f38ba8> in your inventory!"
    inventory-full: "<glyph:warning_blue> <#f38ba8>Your inventory is full! <#a6adc8>Please free up at least 1 slot to receive the <#89dceb>Regear Shulker<#a6adc8>."
    received-shulker: "<glyph:warning_blue> <#a6e3a1>Received <#89dceb><b>Shulker Regear</b><#a6e3a1>! Place it on the ground to restock."
    combat-tagged: "<glyph:warning_blue> <#f38ba8>Cannot regear while in combat! <#a6adc8>Wait <#f9e2af><b>%seconds%s</b> <#a6adc8>after taking damage."
    on-cooldown: "<glyph:warning_blue> <#f38ba8>Regear is on cooldown! <#a6adc8>Please wait <#f9e2af><b>%seconds%s</b>."
    no-kit-loaded: "<glyph:warning_blue> <#f38ba8>No previous kit snapshot found! <#a6adc8>Please load a kit first (/k1)."
    success: "<glyph:warning_blue> <#a6e3a1>Successfully regeared and restored inventory slots!"

score:
  auto-reset:
    enabled: true
    interval-minutes: 60
    broadcast: true
  request-timeout-seconds: 60
  messages:
    no-permission: "<glyph:warning_blue> <#f38ba8>You do not have permission to execute this command."
    player-not-found: "<glyph:warning_blue> <#f38ba8>Player <#89dceb>%target%<#f38ba8> is not online."
    cannot-target-self: "<glyph:warning_blue> <#f38ba8>You cannot send a reset request to yourself."
    request-sent: "<glyph:warning_blue> <#a6e3a1>Sent a 1v1 score reset request to <#89dceb>%target%<#a6e3a1>. Waiting for approval..."
    request-received: "<glyph:warning_blue> <#89dceb>%sender% <#a6adc8>has requested to reset your 1v1 score! <click:run_command:'/score accept %sender%'><hover:show_text:'<#a6e3a1>Click to accept'><#a6e3a1><b>[ACCEPT]</b></hover></click> <click:run_command:'/score decline %sender%'><hover:show_text:'<#f38ba8>Click to decline'><#f38ba8><b>[DECLINE]</b></hover></click>"
    no-pending-request: "<glyph:warning_blue> <#f38ba8>You have no pending reset request from <#89dceb>%sender%<#f38ba8>."
    request-declined: "<glyph:warning_blue> <#f38ba8>Reset request with <#89dceb>%player%<#f38ba8> was declined."
    score-reset-success: "<glyph:warning_blue> <#a6e3a1>1v1 score between <#89dceb>%player1% <#a6e3a1>and <#89dceb>%player2% <#a6e3a1>has been reset!"
    global-reset-admin: "<glyph:warning_blue> <#a6e3a1>All 1v1 scores have been globally reset by an administrator."
    global-reset-auto: "<glyph:warning_blue> <#a6e3a1>All 1v1 scores have been automatically reset (Hourly Schedule)."
    usage: "<glyph:warning_blue> <#a6adc8>Usage: <#89dceb>/score reset <player> <#6c7086>| <#89dceb>/score accept <player> <#6c7086>| <#89dceb>/score resetall"

admin:
  messages:
    reload-success: "<glyph:warning_blue> <#a6e3a1>VCarterUtils configuration and regear whitelist reloaded successfully!"
    
