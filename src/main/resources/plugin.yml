name: VCarterUtils
version: '1.3.0'
main: me.nh4n.vcarterutils.VCarterUtils
api-version: '1.21'
author: Nh4n
description: 1v1 Score Tracker, Shulker Regear, Pearl & Mace Cooldowns, Xbow Counter, Lobby Hotbar, Death Back, and Practice Training Mode.
softdepend:
  - PlaceholderAPI
  - PerPlayerKit
  - Nexo
  - Multiverse-Core
  - SlimeWorldManager
  - AdvancedSlimeWorldManager
  - SlimeWorldPlugin
  - FoCombatTag
commands:
  score:
    description: Manage 1v1 scores and reset requests
    aliases: [vscore, sc]
  vcarterutils:
    description: Main plugin command
    aliases: [vcu, vcarter]
  back:
    description: Return to your previous death location
    aliases: [deathback, return]
  setting:
    description: Open personal PvP settings or Admin Cooldown Manager
    aliases: [settings, options, vsetting]
  training:
    description: Toggle Training Mode or open settings GUI
    aliases: [train, vtraining, vtrain]
permissions:
  vcarterutils.admin:
    description: Allows administrative score reset, config reload and /setting admin GUI
    default: op
