# ==============================================================
#                 VCarterUtils Main Configuration
#       Catppuccin Pastel Palette & Glyph Integration
# ==============================================================
# All feature settings are modularized into dedicated files:
# - regear.yml       : Shulker Regear inventory restock system
# - training.yml     : Training Mode & practice settings
# - lobby.yml        : Lobby hotbar shortcuts & queue items
# - combattag.yml    : Combat Tag manager & anti-interrupt
# - totem.yml        : Totem limits & Auto-Potion
# - pearl.yml        : Ender Pearl cooldowns & world rules
# - mace.yml         : Mace cooldowns & smash attack rules
# - xbow.yml         : Crossbow tick speed counter
# - back.yml         : Death location teleportation
# - score.yml        : 1v1 score tracking system
# - menu.yml         : /setting and World Manager menus
# ==============================================================

# ==============================================================
#               GLOBAL THEME & MESSAGE FORMATTING
# ==============================================================
# Quickly edit prefixes, error prefixes, and colors for all messages!
# Typography Rule:
#   - Messages with a <glyph:warning_*> prefix MUST NOT contain
#     an item sprite (<sprite:items:item/...>) after the prefix.
#   - Standalone item messages/HUDs may use <white><sprite:items:item/...></white>
#     without a glyph prefix for clean baseline alignment.
#
# Prefix Placeholders:
#   %prefix% or %prefix_info%    - Blue info notification prefix
#   %prefix_success%             - Blue success notification prefix
#   %prefix_error%               - Red error notification prefix
#   %prefix_combat%              - Red combat alert prefix
#   %prefix_warning%             - Purple warning notification prefix
#   %prefix_admin%               - Purple admin & staff prefix
#   %prefix_blue%                - Explicit <glyph:warning_blue> prefix
#   %prefix_red%                 - Explicit <glyph:warning_red> prefix
#   %prefix_purple%              - Explicit <glyph:warning_purple> prefix
#
# Catppuccin Color Placeholders:
#   %c_primary%                  - Sky (#89dceb - names, commands, highlights)
#   %c_success%                  - Green (#a6e3a1 - enabled, success, accept)
#   %c_error%                    - Red (#f38ba8 - disabled, errors, decline)
#   %c_warning%                  - Yellow (#f9e2af - timers, cooldowns, presets)
#   %c_purple%                   - Mauve (#cba6f7 - admin, world rules, accents)
#   %c_text%                     - Subtext0 (#a6adc8 - main message text)
#   %c_muted%                    - Overlay0 (#6c7086 - separators, brackets)
# ==============================================================
theme:
  prefixes:
    info: "<glyph:warning_blue> "
    success: "<glyph:warning_blue> "
    error: "<glyph:warning_red> "
    combat: "<glyph:warning_red> "
    warning: "<glyph:warning_purple> "
    admin: "<glyph:warning_purple> "
    blue: "<glyph:warning_blue> "
    red: "<glyph:warning_red> "
    purple: "<glyph:warning_purple> "

  colors:
    primary: "<#89dceb>"
    success: "<#a6e3a1>"
    error: "<#f38ba8>"
    warning: "<#f9e2af>"
    purple: "<#cba6f7>"
    text: "<#a6adc8>"
    muted: "<#6c7086>"

admin:
  messages:
    reload-success: "%prefix_admin%%c_purple%<b>sʏsᴛᴇᴍ</b> %c_muted%» %c_success%Configuration files reloaded successfully."
