# ==============================================================
#                 ENDER PEARL COOLDOWN SYSTEM
# ==============================================================
# Configures personal, per-world, and global Ender Pearl cooldowns.
# ==============================================================

pearl-cooldown:
  enabled: true
  default-seconds: 1
  available-options:
    - 1
    - 3
    - 5
    - 6
    - 8
    - 10
    - 15
  clear-on-respawn: true
  clear-on-kit-load: true
  send-chat-on-change: true

  global-force:
    enabled: false
    seconds: 1

  force-worlds:
    enabled: true
    worlds:
      ffa_diamond: 10

  messages:
    cooldown-changed: "<white><sprite:items:item/ender_pearl></white> %c_text%ᴘᴇᴀʀʟ ᴄᴏᴏʟᴅᴏᴡɴ %c_muted%» %c_primary%<b>%seconds%s</b>"
    invalid-option: "%prefix_error%%c_error%<b>ɪɴᴠᴀʟɪᴅ ᴄᴏᴏʟᴅᴏᴡɴ</b> %c_muted%» %c_text%Available: %c_primary%%options%"
    world-status-normal: "%c_success%● ᴘᴇʀsᴏɴᴀʟ sᴇᴛᴛɪɴɢ ᴀᴄᴛɪᴠᴇ"
    world-status-forced: "%c_error%<b>✖ CANNOT CHANGE PERSONAL COOLDOWN</b>\n<!italic>%c_muted%▪ %c_warning%ʀᴇᴀsᴏɴ: %c_text%Forced in this world %c_primary%<b>(%forced%s)</b>"
    world-status-global-forced: "%c_error%<b>✖ CANNOT CHANGE PERSONAL COOLDOWN</b>\n<!italic>%c_muted%▪ %c_warning%ʀᴇᴀsᴏɴ: %c_text%Forced globally by Admin %c_primary%<b>(%forced%s)</b>"
    locked-title: "%c_error%<b>✖ COOLDOWN LOCKED!</b>"
    locked-subtitle-world: "%c_text%Forced in this world %c_muted%» %c_primary%<b>%forced%s</b>"
    locked-subtitle-global: "%c_text%Forced globally by Admin %c_muted%» %c_primary%<b>%forced%s</b>"
    locked-chat-world: "%prefix_error%%c_error%<b>ᴄᴏᴏʟᴅᴏᴡɴ ʟᴏᴄᴋᴇᴅ</b> %c_muted%» %c_text%Pearl cooldown is forced to %c_primary%<b>%forced%s</b> %c_text%in this world."
    locked-chat-global: "%prefix_error%%c_error%<b>ᴄᴏᴏʟᴅᴏᴡɴ ʟᴏᴄᴋᴇᴅ</b> %c_muted%» %c_text%Pearl cooldown is forced globally to %c_primary%<b>%forced%s</b>%c_text%."
