  filler:
    enabled: true
    material: "GRAY_STAINED_GLASS_PANE"
    name: " "
  options-format:
    selected: "<#a6e3a1><b>[%seconds%s]</b>"
    unselected: "<#6c7086>%seconds%s"
    separator: " <#6c7086>• "
  items:
    pearl-cooldown:
      enabled: true
      type: "PEARL_COOLDOWN"
      slot: 11
      material: "ENDER_PEARL"
      show-seconds-as-amount: true
      name: "<!italic><white><sprite:items:item/ender_pearl></white> <#89dceb><b>Pearl Cooldown</b>"
      lore:
        - "<!italic><#6c7086>ᴘᴇʀsᴏɴᴀʟ ᴘᴠᴘ sᴇᴛᴛɪɴɢ"
        - ""
        - "<!italic><#6c7086>▪ <#a6adc8>ᴘᴇʀsᴏɴᴀʟ: <#89dceb><b>%current%s</b> <#6c7086>(ᴅᴇꜰᴀᴜʟᴛ: %default%s)"
