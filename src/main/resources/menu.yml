      enabled: true
      type: "XBOW_COUNTER_TOGGLE"
      slot: 14
      material: "CROSSBOW"
      name: "<!italic><white><sprite:items:item/crossbow_standby></white> <#89dceb><b>Xbow Tick Counter</b>"
      lore:
        - "<!italic><#6c7086>ᴀᴄᴛɪᴏɴʙᴀʀ ʜᴜᴅ"
        - ""
        - "<!italic><#6c7086>▪ <#a6adc8>sᴛᴀᴛᴜs: %xbow_counter_status%"
        - ""
        - "<!italic><#a6adc8>Displays how many ticks your"
        - "<!italic><#a6adc8>Xbow cart setup took on Action Bar."
        - ""
        - "<!italic><white><glyph:left_click></white> <#89dceb>ᴛᴏɢɢʟᴇ ᴏɴ/ᴏꜰꜰ"
    lobby-hotbar-toggle:
      enabled: true
      type: "LOBBY_HOTBAR_TOGGLE"
      slot: 15
      material: "NETHER_STAR"
      name: "<!italic><white><sprite:items:item/compass_16></white> <#89dceb><b>Lobby Hotbar</b>"
      lore:
        - "<!italic><#6c7086>ʟᴏʙʙʏ ᴜᴛɪʟɪᴛʏ"
        - ""
        - "<!italic><#6c7086>▪ <#a6adc8>sᴛᴀᴛᴜs: %lobby_hotbar_status%"
        - ""
        - "<!italic><#a6adc8>Replaces your hotbar with quick"
        - "<!italic><#a6adc8>shortcut items while in the lobby."
        - ""
        - "<!italic><white><glyph:left_click></white> <#89dceb>ᴛᴏɢɢʟᴇ ᴏɴ/ᴏꜰꜰ"
    admin-panel:
      enabled: true
      type: "ADMIN_MENU"
      slot: 4
      nexo-id: "admin_setting"
      material: "nexo:admin_setting"
      name: "<!italic><#cba6f7><b>World Manager</b>"
      lore:
        - "<!italic><#6c7086>ᴀᴅᴍɪɴɪsᴛʀᴀᴛᴏʀ ᴘᴀɴᴇʟ"
        - ""
        - "<!italic><#a6adc8>Configure per-world & global cooldowns,"
        - "<!italic><#a6adc8>Mace, Pearl, and Combat Tag timers."
        - ""
        - "<!italic><white><glyph:left_click></white> <#cba6f7>ᴏᴘᴇɴ ᴡᴏʀʟᴅ ᴍᴀɴᴀɢᴇʀ"
    close-button:
      enabled: true
      type: "CLOSE"
      slot: 22
      nexo-id: "cancel"
      material: "nexo:cancel"
      name: "<!italic><#f38ba8><b>✖ Close</b>"
      lore:
        - "<!italic><white><glyph:left_click></white> <#6c7086>ᴄʟᴏsᴇ ᴍᴇɴᴜ"

admin-menu:
  title: "<#6c7086>✦ <#cba6f7><b>ᴡᴏʀʟᴅ ᴍᴀɴᴀɢᴇʀ</b> <#6c7086>✦"
  messages:
    global-force-toggled: "%prefix_admin%%c_purple%<b>ɢʟᴏʙᴀʟ</b> %c_muted%» %c_text%%type% Force: %status%"
    default-updated: "%prefix_admin%%c_purple%<b>ᴅᴇꜰᴀᴜʟᴛ</b> %c_muted%» %c_text%Default %type% set to %c_primary%<b>%seconds%s</b>%c_text%."
    world-force-updated: "%prefix_admin%%c_primary%<b>%world%</b> %c_muted%• %c_text%%type% Force %c_muted%» %status%"
    world-rescanned: "%prefix_info%%c_success%<b>sᴄᴀɴɴᴇʀ</b> %c_muted%» %c_text%World list rescanned successfully."
